    <text x="467" y="55" font-size="22" font-weight="700">B</text>
    <text x="774" y="55" font-size="22" font-weight="700">C</text>
    <text x="1081" y="55" font-size="22" font-weight="700">D</text>
    <text x="160" y="337" font-size="18">Fizzing flask</text>
    <text x="467" y="337" font-size="18">Pour + fizz</text>
    <text x="774" y="337" font-size="18">Molecules change</text>
    <text x="1081" y="337" font-size="18">Foaming crock</text>
  </g>
  <g fill="none" stroke="#263f3a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">

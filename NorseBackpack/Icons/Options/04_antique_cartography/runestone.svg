<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc"><title id="title">Runestone — Antique cartography</title><desc id="desc">Antique cartography version of runestone.</desc><defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="5" stroke="#283B34" stroke-width="1"/></pattern><style>.ink{fill:url(#hatch);stroke:#283B34;stroke-width:1.7}.beak{fill:none;stroke:#283B34;stroke-width:1.7}.accent{fill:none;stroke:#B56A2A;stroke-width:1.7}.line,.detail,.accentline,.haft{fill:none;stroke:#283B34;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.accentline{stroke:#B56A2A;stroke-width:1.4}.haft{stroke-width:2.7}.detail{stroke-width:1.2}.boss{fill:url(#hatch);stroke:#283B34;stroke-width:1.8}.eye{fill:#283B34}</style></defs><g ><path class="ink" d="m18 54-2-30 8-13 18 2 7 12-3 29Z"/><path class="accentline" d="M25 45V22m0 11 13-10M25 34l13 10M21 49h24"/><path class="line" d="M13 55h38"/></g></svg>

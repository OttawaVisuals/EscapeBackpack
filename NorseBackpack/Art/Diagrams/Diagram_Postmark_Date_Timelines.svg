<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 250" role="img" aria-label="Two timelines of eighteen postmark dates. In the rejected block version the four trails run one after another so sorting by date already separates them. In the chosen interleaved version the trails overlap, so players must split by stamp series before ordering within each trail.">
<g font-size="11.5" font-weight="700"><text x="0" y="34" fill="#8a7d63">BLOCKS — not chosen</text><text x="0" y="150" fill="#254c40">INTERLEAVED — chosen</text></g>
<line x1="90" y1="58" x2="808" y2="58" stroke="#a99a7b" stroke-width="1.2"/>
<g opacity="0.4">
<g fill="#216580"><rect x="96" y="44" width="9" height="28" rx="1"/><rect x="132" y="44" width="9" height="28" rx="1"/><rect x="168" y="44" width="9" height="28" rx="1"/></g>
<g fill="#a2562d"><rect x="222" y="44" width="9" height="28" rx="1"/><rect x="258" y="44" width="9" height="28" rx="1"/><rect x="294" y="44" width="9" height="28" rx="1"/><rect x="330" y="44" width="9" height="28" rx="1"/><rect x="366" y="44" width="9" height="28" rx="1"/><rect x="402" y="44" width="9" height="28" rx="1"/></g>
<g fill="#6d528b"><rect x="456" y="44" width="9" height="28" rx="1"/><rect x="492" y="44" width="9" height="28" rx="1"/><rect x="528" y="44" width="9" height="28" rx="1"/></g>
<g fill="#467444"><rect x="582" y="44" width="9" height="28" rx="1"/><rect x="618" y="44" width="9" height="28" rx="1"/><rect x="654" y="44" width="9" height="28" rx="1"/><rect x="690" y="44" width="9" height="28" rx="1"/><rect x="726" y="44" width="9" height="28" rx="1"/><rect x="762" y="44" width="9" height="28" rx="1"/></g>
</g>
<text x="90" y="94" font-size="12" fill="#657065">Sorting by date would already separate the trails — the stamp series would have nothing left to do.</text>
<line x1="90" y1="174" x2="808" y2="174" stroke="#a99a7b" stroke-width="1.2"/>
<g>
<rect x="96" y="160" width="9" height="28" rx="1" fill="#216580"/><rect x="132" y="160" width="9" height="28" rx="1" fill="#a2562d"/>
<rect x="168" y="160" width="9" height="28" rx="1" fill="#216580"/><rect x="204" y="160" width="9" height="28" rx="1" fill="#467444"/>
<rect x="240" y="160" width="9" height="28" rx="1" fill="#a2562d"/><rect x="276" y="160" width="9" height="28" rx="1" fill="#6d528b"/>
<rect x="312" y="160" width="9" height="28" rx="1" fill="#216580"/><rect x="348" y="160" width="9" height="28" rx="1" fill="#467444"/>
<rect x="384" y="160" width="9" height="28" rx="1" fill="#a2562d"/><rect x="420" y="160" width="9" height="28" rx="1" fill="#467444"/>
<rect x="456" y="160" width="9" height="28" rx="1" fill="#6d528b"/><rect x="492" y="160" width="9" height="28" rx="1" fill="#a2562d"/>
<rect x="528" y="160" width="9" height="28" rx="1" fill="#467444"/><rect x="564" y="160" width="9" height="28" rx="1" fill="#a2562d"/>
<rect x="600" y="160" width="9" height="28" rx="1" fill="#6d528b"/><rect x="636" y="160" width="9" height="28" rx="1" fill="#467444"/>
<rect x="672" y="160" width="9" height="28" rx="1" fill="#a2562d"/><rect x="708" y="160" width="9" height="28" rx="1" fill="#467444"/>
</g>
<text x="90" y="210" font-size="12" fill="#254c40">The hidden rule becomes <tspan font-weight="700">split by stamp first, then order within each</tspan> — a rule to discover, not an instruction to follow.</text>
<text x="90" y="232" font-size="12" fill="#657065">Within each trail the dates still run in route order, so every digit still draws correctly.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" role="img" aria-label="Schematic of a postcard back showing four zones: Aunt Liv's handwritten message filling the left half, and the stamp and postmark, a shrunk fixed address block, and a titled Fun Fact block stacked in the right half, address on top and Fun Fact underneath it.">
<rect x="40" y="24" width="440" height="272" fill="#f0e6cf" stroke="#a99a7b" stroke-width="1.5"/>
<line x1="254" y1="46" x2="254" y2="274" stroke="#a99a7b" stroke-width="1.5"/>
<g stroke="#8a7d63" stroke-width="1.5" opacity="0.5"><line x1="60" y1="66" x2="234" y2="66"/><line x1="60" y1="88" x2="234" y2="88"/><line x1="60" y1="110" x2="216" y2="110"/><line x1="60" y1="132" x2="234" y2="132"/><line x1="60" y1="154" x2="192" y2="154"/><line x1="60" y1="176" x2="234" y2="176"/><line x1="60" y1="198" x2="226" y2="198"/><line x1="60" y1="220" x2="234" y2="220"/><line x1="60" y1="242" x2="176" y2="242"/><line x1="60" y1="264" x2="220" y2="264"/></g>
<rect x="390" y="42" width="68" height="80" fill="#fffdf7" stroke="#216580" stroke-width="1.5" stroke-dasharray="3 2"/>
<path d="M405 106 L447 106 L439 87 L426 76 L413 87 Z" fill="#216580" opacity="0.55"/>
<g transform="rotate(-6 350 84)"><circle cx="350" cy="84" r="30" fill="none" stroke="#25372f" stroke-width="2.2" opacity="0.6" stroke-dasharray="70 20"/><circle cx="350" cy="84" r="24" fill="none" stroke="#25372f" stroke-width="1" opacity="0.45"/><text x="350" y="80" font-size="7.5" font-weight="700" fill="#25372f" text-anchor="middle" opacity="0.85">L'ANSE</text><text x="350" y="93" font-size="8.5" font-weight="700" fill="#25372f" text-anchor="middle" opacity="0.85">07 JUL</text></g>
<rect x="266" y="136" width="188" height="42" fill="none" stroke="#a99a7b" stroke-width="1.5"/>
<g stroke="#a99a7b" stroke-width="1.5" opacity="0.5"><line x1="278" y1="153" x2="440" y2="153"/><line x1="278" y1="167" x2="410" y2="167"/></g>
<rect x="266" y="186" width="188" height="86" fill="none" stroke="#b56a2a" stroke-width="1.5"/>
<text x="278" y="204" font-size="10.5" font-weight="700" letter-spacing="0.5" fill="#b56a2a">FUN FACT</text>
<g stroke="#8a7d63" stroke-width="1.5" opacity="0.5"><line x1="278" y1="218" x2="442" y2="218"/><line x1="278" y1="234" x2="442" y2="234"/><line x1="278" y1="250" x2="400" y2="250"/></g>
<g font-size="12.5">
<g><circle cx="506" cy="62" r="11" fill="#216580"/><text x="506" y="66" fill="#fffdf7" font-size="11" font-weight="700" text-anchor="middle">1</text><text x="528" y="59" font-weight="700" fill="#25372f">Stamp + postmark</text><text x="528" y="77" fill="#657065" font-size="12">trail, date, place — the meta puzzle, on all 18</text></g>
<g><circle cx="506" cy="128" r="11" fill="#657065"/><text x="506" y="132" fill="#fffdf7" font-size="11" font-weight="700" text-anchor="middle">2</text><text x="528" y="125" font-weight="700" fill="#25372f">Her handwriting</text><text x="528" y="143" fill="#657065" font-size="12">voice, tasks, and the selection and ordering rules</text></g>
<g><circle cx="506" cy="200" r="11" fill="#a99a7b"/><text x="506" y="204" fill="#fffdf7" font-size="11" font-weight="700" text-anchor="middle">3</text><text x="528" y="197" font-weight="700" fill="#25372f">Address — shrunk</text><text x="528" y="215" fill="#657065" font-size="12">fixed on all 18 — the constant that makes the rest read as variable</text></g>
<g><circle cx="506" cy="256" r="11" fill="#b56a2a"/><text x="506" y="260" fill="#fffdf7" font-size="11" font-weight="700" text-anchor="middle">4</text><text x="528" y="253" font-weight="700" fill="#25372f">Fun Fact — new name, freed-up space</text><text x="528" y="271" fill="#657065" font-size="12">real trivia, always typed — the only place a number can hide</text></g>
</g>
<g stroke="#8a7d63" stroke-width="1" opacity="0.5" fill="none"><line x1="446" y1="66" x2="493" y2="62"/><line x1="150" y1="160" x2="493" y2="130"/><line x1="454" y1="157" x2="493" y2="200"/><line x1="454" y1="230" x2="493" y2="256"/></g>
</svg>

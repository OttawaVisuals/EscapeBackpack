<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" role="img" aria-label="Aud's map sheet split into two side-by-side panels. The left panel is a new zoomed-in detail of the Dalir and Hvammur area with its own small grid, showing four treasure-hunt landmarks spread across distinct cells: a mill, Auðarsteinn, a sheepfold, and a lookalike chapel pair where one chapel sits at the decoy site, Bjarnarhöfn. The right panel is the existing full-region map, shifted right, unchanged in content and scale, still carrying Aud's four real postcard stops.">
<rect x="40" y="60" width="600" height="300" rx="6" fill="none" stroke="#a99a7b" stroke-width="1"/>
<text x="340" y="45" font-size="12" fill="#657065" text-anchor="middle">one physical map sheet</text>
<line x1="270" y1="60" x2="270" y2="360" stroke="#6d528b" stroke-width="1.5"/>

<text x="155" y="85" font-size="14" font-weight="700" fill="#6d528b" text-anchor="middle">Zoomed detail panel</text>
<text x="155" y="101" font-size="12" fill="#657065" text-anchor="middle">Dalir / Hvammur, own grid</text>

<g stroke="#a99a7b" stroke-width="0.5">
<line x1="100" y1="120" x2="100" y2="330"/><line x1="155" y1="120" x2="155" y2="330"/><line x1="210" y1="120" x2="210" y2="330"/>
<line x1="60" y1="185" x2="250" y2="185"/><line x1="60" y1="250" x2="250" y2="250"/>
</g>

<g fill="#6d528b">
<circle cx="127" cy="150" r="5"/><circle cx="182" cy="150" r="5"/><circle cx="127" cy="215" r="5"/>
</g>
<text x="127" y="168" font-size="12" fill="#4a3a5f" text-anchor="middle">Mill</text>
<text x="182" y="168" font-size="12" fill="#4a3a5f" text-anchor="middle">Auðarsteinn</text>
<text x="127" y="233" font-size="12" fill="#4a3a5f" text-anchor="middle">Sheepfold</text>

<circle cx="182" cy="290" r="5" fill="#b56a2a"/>
<text x="182" y="308" font-size="12" fill="#8a4a1c" text-anchor="middle">Chapel pair</text>
<text x="182" y="322" font-size="12" fill="#8a4a1c" text-anchor="middle">(1 is the decoy)</text>

<text x="470" y="85" font-size="14" font-weight="700" fill="#454541" text-anchor="middle">Main map, shifted right</text>
<text x="470" y="101" font-size="12" fill="#657065" text-anchor="middle">unchanged content, unchanged scale</text>

<g stroke="#a99a7b" stroke-width="0.5">
<line x1="360" y1="130" x2="580" y2="130"/><line x1="360" y1="180" x2="580" y2="180"/>
<line x1="360" y1="230" x2="580" y2="230"/><line x1="360" y1="280" x2="580" y2="280"/>
<line x1="410" y1="115" x2="410" y2="330"/><line x1="460" y1="115" x2="460" y2="330"/>
<line x1="510" y1="115" x2="510" y2="330"/><line x1="560" y1="115" x2="560" y2="330"/>
</g>

<g fill="#888780">
<circle cx="460" cy="155" r="4"/><circle cx="415" cy="200" r="4"/><circle cx="530" cy="300" r="4"/><circle cx="465" cy="255" r="4"/>
</g>
<text x="470" y="158" font-size="11" fill="#454541">A2 Hvammur</text>
<text x="425" y="203" font-size="11" fill="#454541">A1 Dögurðarnes</text>
<text x="540" y="303" font-size="11" fill="#454541">A3 Esjuberg</text>
<text x="475" y="258" font-size="11" fill="#454541">AD Bjarnarhöfn</text>

<text x="340" y="380" font-size="12" fill="#657065" text-anchor="middle">Same sheet, two scales side by side — the split solves the collision without touching the main map's own job.</text>
</svg>
